# 示例值：需按生产基线压测调整。此文件不会自动安装。
# 匹配本仓库 deploy/workbuddy-web.service；若实际 unit 名不同，请重命名 drop-in 目录。
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=4

[Service]
MemoryHigh=224M
MemoryMax=320M
MemorySwapMax=128M
OOMScoreAdjust=500
OOMPolicy=kill
Restart=on-failure
RestartSec=5s
TasksMax=200
LimitNOFILE=8192
CPUWeight=80
