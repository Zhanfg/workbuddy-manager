# 示例值：会限制 Go 账号池峰值，必须通过并发 SSE/账号轮换回归后安装。
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=4

[Service]
MemoryHigh=128M
MemoryMax=192M
MemorySwapMax=64M
# Go 1.22+ runtime-managed heap soft limit, NOT a process RSS hard cap.
# Under 1M-context bursts, monitor CPU/GC pressure and raise if throughput falls.
Environment=GOMEMLIMIT=144MiB
OOMScoreAdjust=450
OOMPolicy=kill
Restart=on-failure
RestartSec=5s
TasksMax=256
LimitNOFILE=8192
CPUWeight=80
